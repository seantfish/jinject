[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jinject"
dynamic = ["version"]
dependencies = [
    "jinja2>=3.0.0",
]
requires-python = ">=3.10"
authors = [
  {name = "Sean Fish", email = "seantfish@gmail.com"},
]
description = "Jinja templating with bundled Python"
readme = "README.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jinject/_version.py"


[project.urls]
Repository = "https://github.com/seantfish/jinja.git"

[project.scripts]
jinject = "jinject.cli:main"

[project.entry-points."jinject.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/jinject"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
